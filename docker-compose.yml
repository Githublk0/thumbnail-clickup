services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thumbnail
      POSTGRES_PASSWORD: thumbnail
      POSTGRES_DB: thumbnail_intelligence
    ports: ["5432:5432"]
    volumes: ["thumbnail_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thumbnail -d thumbnail_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thumbnail
      MINIO_ROOT_PASSWORD: thumbnail-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["thumbnail_minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://thumbnail:thumbnail@postgres:5432/thumbnail_intelligence
      STORAGE_ENDPOINT: http://minio:9000
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: sh -c "node apps/api/src/migrate.js && node apps/api/src/server.js"
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://thumbnail:thumbnail@postgres:5432/thumbnail_intelligence
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: node apps/api/src/worker-runner.js
volumes:
  thumbnail_pg:
  thumbnail_minio:
